name: Upstream sync

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity and upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/teng-lin/notebooklm-py.git
          git fetch --no-tags upstream main
          git fetch origin main

      - name: Prepare upstream integration branch
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/upstream-sync"
          git checkout -B "$branch" origin/main

          upstream_sha="$(git rev-parse upstream/main)"
          fork_sha="$(git rev-parse origin/main)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "fork_sha=$fork_sha" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream_sha" "$fork_sha"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fork already contains upstream main."
            exit 0
          fi

          if ! git merge --no-edit "$upstream_sha"; then
            echo "::error::Upstream sync has merge conflicts. No automatic resolution or main-branch update was attempted."
            git status --short
            exit 1
          fi

          if git diff --quiet "$fork_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push integration branch
        if: steps.sync.outputs.changed == 'true'
        run: git push --force-with-lease origin automation/upstream-sync

      - name: Open or update pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          FORK_SHA: ${{ steps.sync.outputs.fork_sha }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## Upstream integration

          This PR brings upstream `teng-lin/notebooklm-py` into the fork.

          - Upstream commit: `$UPSTREAM_SHA`
          - Fork base commit: `$FORK_SHA`
          - Source: https://github.com/teng-lin/notebooklm-py/commit/$UPSTREAM_SHA

          Please review the diff and required checks before merging. This workflow never auto-merges.
          EOF
          )"

          existing="$(gh pr list --head automation/upstream-sync --base main --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore: sync upstream notebooklm-py" --body "$body"
          else
            gh pr create --base main --head automation/upstream-sync \
              --title "chore: sync upstream notebooklm-py" --body "$body"
          fi
